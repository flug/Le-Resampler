<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 22px; font-weight: 700; }
    .version { font-size: 12px; color: #888; }
    p { font-size: 13px; color: #aaa; line-height: 1.6; max-width: 320px; }
    #bmc-btn {
      margin-top: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      opacity: 0.9;
      transition: opacity 0.15s;
    }
    #bmc-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <h1>Le Resampler</h1>
  <span class="version" id="version-label">Version …</span>
  <p>
    Audio sample manager for music producers. Scan your library,
    tag your files, preview them and export them to your SD card
    or MPC sampler in one click — automatically organised by category.
  </p>
  <button id="bmc-btn">
    <img src="https://www.buymeacoffee.com/assets/img/custom_images/orange_img.png"
         alt="Buy Me A Coffee" height="40">
  </button>

  <script type="module">
    const { invoke } = window.__TAURI__.core;
    document.getElementById('bmc-btn').addEventListener('click', () => {
      invoke('open_url', { url: 'https://buymeacoffee.com/flugv1t' });
    });
    invoke('get_app_version').then(v => {
      document.getElementById('version-label').textContent = 'Version ' + v;
    }).catch(() => {});
  </script>
</body>
</html>
