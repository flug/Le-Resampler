[package]
name = "sample-manager"
version = "0.1.0"
description = "Local audio sample library manager"
authors = []
edition = "2021"

[lib]
name = "sample_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sample-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
walkdir = "2"
lofty = "0.18"
rodio = { version = "0.22", features = ["symphonia-all"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
