name: Release

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 08:00 UTC
  workflow_dispatch:     # Manual trigger

permissions:
  contents: write

jobs:
  # ── 1. Check for new commits since last tag ───────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check commits since last tag
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag — triggering first release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            COUNT=$(git log "$LAST_TAG..HEAD" --oneline | wc -l | tr -d ' ')
            echo "$COUNT commit(s) since $LAST_TAG"
            [ "$COUNT" -gt 0 ] && echo "should_release=true" >> $GITHUB_OUTPUT || echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump patch version
        id: bump
        if: steps.check.outputs.should_release == 'true'
        run: |
          CURRENT=$(jq -r '.version' src-tauri/tauri.conf.json)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Version: $CURRENT -> $NEW_VERSION"

      - name: Update tauri.conf.json and Cargo.toml
        if: steps.check.outputs.should_release == 'true'
        run: |
          VERSION=${{ steps.bump.outputs.version }}
          jq ".version = \"$VERSION\"" src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          sed -i "0,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Commit and tag new version
        if: steps.check.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin main --tags

  # ── 2. Multi-platform build ───────────────────────────────────────────────
  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            label: Linux x86_64
          - platform: windows-latest
            args: ''
            label: Windows x86_64
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            label: macOS Universal

    runs-on: ${{ matrix.platform }}
    name: Build — ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev libasound2-dev pkg-config

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ needs.check.outputs.tag }}
          releaseName: Le Resampler ${{ needs.check.outputs.tag }}
          releaseBody: |
            ## Le Resampler ${{ needs.check.outputs.tag }}

            Automatic weekly release.
            See the [commit history](https://github.com/${{ github.repository }}/commits/main) for details.

            ## Downloads

            | Platform | File |
            |----------|------|
            | macOS (Universal — Apple Silicon + Intel) | `Le Resampler_*_universal.dmg` |
            | Windows | `Le Resampler_*_x64-setup.exe` |
            | Linux | `le-resampler_*_amd64.AppImage` |

            ## macOS — Homebrew

            ```bash
            brew tap flugv1/Le-Resampler https://github.com/flugv1/Le-Resampler
            brew install --cask le-resampler
            ```

            [![Buy Me A Coffee](https://www.buymeacoffee.com/assets/img/custom_images/orange_img.png)](https://buymeacoffee.com/flugv1t)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── 3. Update Homebrew cask in this repo ─────────────────────────────────
  homebrew:
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    name: Update Homebrew cask
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute DMG SHA256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          sleep 60
          DMG_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | jq -r '.assets[] | select(.name | test("universal\\.dmg$")) | .browser_download_url')
          if [ -z "$DMG_URL" ] || [ "$DMG_URL" = "null" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          curl -L -o app.dmg "$DMG_URL"
          echo "sha256=$(shasum -a 256 app.dmg | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Write cask and commit
        if: steps.sha.outputs.skip == 'false'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p Casks
          cat > Casks/le-resampler.rb << EOF
          cask "le-resampler" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/${REPO}/releases/download/v#{version}/Le%20Resampler_#{version}_universal.dmg"
            name "Le Resampler"
            desc "Audio sample manager for music producers and Akai MPC Sample users"
            homepage "https://github.com/${REPO}"

            app "Le Resampler.app"

            zap trash: [
              "~/Library/Application Support/com.sampli.leresampler",
              "~/Library/Preferences/com.sampli.leresampler.plist",
            ]
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/le-resampler.rb
          git diff --cached --quiet || git commit -m "chore: update Homebrew cask to ${VERSION}"
          git push
